# Collecte des données de marché OKX (API publique, sans clé).
# Les données sont publiées sur la branche orpheline `data` (jamais sur main).
# - Lancement manuel (onglet Actions > Collect market data > Run workflow)
# (plus de lancement automatique à chaque push : trop coûteux en minutes)
# Artefacts gardés 1 jour seulement : les données sont déjà publiées sur la branche data.
# - Mise à jour automatique chaque dimanche à 03:17 UTC (le funding n'est disponible
#   que sur une fenêtre récente : on l'accumule semaine après semaine).
# Budget : ~430 min pour la première collecte, puis ~25 min par semaine
# (quota gratuit GitHub pour dépôt privé : 2 000 min/mois).
name: Collect market data

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Date de début (AAAA-MM-JJ)"
        default: "2020-01-01"
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

env:
  START: ${{ github.event.inputs.start || '2020-01-01' }}

jobs:
  candles:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Perpétuels globaux (approximation des X-Perps)
          # 1 min pour BTC et ETH (actifs prioritaires, résolution fine des stops),
          # 5 min pour les autres (suffisant pour des signaux 15 min–1 h, 5x moins de requêtes)
          - { inst: BTC-USDT-SWAP, bar: 1m }
          - { inst: ETH-USDT-SWAP, bar: 1m }
          - { inst: SOL-USDT-SWAP, bar: 5m }
          - { inst: XRP-USDT-SWAP, bar: 5m }
          - { inst: DOGE-USDT-SWAP, bar: 5m }
          # Spot (contrôle et repli), 5 minutes
          - { inst: BTC-USDT, bar: 5m }
          - { inst: ETH-USDT, bar: 5m }
          # X-Perps (le vrai produit, cotés depuis le 30/03/2026), 1 minute
          - { inst: BTC-USD_UM_XPERP-310404, bar: 1m, start: "2026-03-01" }
          - { inst: ETH-USD_UM_XPERP-310404, bar: 1m, start: "2026-03-01" }
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les données déjà collectées (reprise)
        continue-on-error: true
        run: |
          git fetch --depth 1 origin +refs/heads/data:refs/remotes/origin/data
          git checkout origin/data -- "data/raw/okx/candles/${{ matrix.inst }}/${{ matrix.bar }}"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Télécharger les bougies
        run: |
          set +e
          python -m okxbot.data.collect candles --inst ${{ matrix.inst }} --bar ${{ matrix.bar }} --start "${{ matrix.start || env.START }}" \
            > "summary_${{ matrix.inst }}_${{ matrix.bar }}.json" 2> "log_${{ matrix.inst }}_${{ matrix.bar }}.txt"
          rc=$?
          cat "summary_${{ matrix.inst }}_${{ matrix.bar }}.json"; tail -40 "log_${{ matrix.inst }}_${{ matrix.bar }}.txt"
          exit $rc
      - name: Contrôle qualité
        if: always()
        run: python -m okxbot.data.collect quality --inst ${{ matrix.inst }} --bar ${{ matrix.bar }} | tee "quality_${{ matrix.inst }}_${{ matrix.bar }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candles-${{ matrix.inst }}-${{ matrix.bar }}
          path: |
            data/raw/okx/candles/${{ matrix.inst }}/${{ matrix.bar }}
            summary_*.json
            quality_*.json
            log_*.txt
          retention-days: 1

  candles_4h:
    # Panier élargi (D-009) : 20 cryptos disponibles en X-Perps, cotées avant juillet 2023, bougies 4 h
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      U20: BTC,ETH,SOL,XRP,DOGE,PEPE,NEAR,UNI,SUI,AAVE,FIL,BNB,ADA,LINK,AVAX,BCH,LTC,ICP,ARB,OP
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les données déjà collectées (reprise)
        continue-on-error: true
        run: |
          git fetch --depth 1 origin +refs/heads/data:refs/remotes/origin/data
          for b in ${U20//,/ }; do git checkout origin/data -- "data/raw/okx/candles/$b-USDT-SWAP/4H" 2>/dev/null || true; done
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Télécharger les bougies 4 h
        run: |
          insts=$(echo "$U20" | sed 's/\([A-Z0-9]*\)/\1-USDT-SWAP/g')
          python -m okxbot.data.collect candles-many --insts "$insts" --bar 4H --start "$START" > summary_candles_4h.json 2> log_candles_4h.txt
          rc=$?; cat summary_candles_4h.json | head -c 3000; tail -20 log_candles_4h.txt; exit $rc
      - name: Funding Binance du panier élargi
        continue-on-error: true
        run: |
          for b in ${U20//,/ }; do
            python -m okxbot.data.collect binance-funding --symbol ${b}USDT >> summary_binance_funding_u20.json || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candles-4h-u20
          path: |
            data/raw/okx/candles/*/4H
            data/raw/binance
            summary_*.json
            log_*.txt
          retention-days: 1

  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer le funding déjà accumulé
        continue-on-error: true
        run: |
          git fetch --depth 1 origin +refs/heads/data:refs/remotes/origin/data
          git checkout origin/data -- data/raw/okx/funding
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Instruments (global + EEA, dont X-Perps)
        run: python -m okxbot.data.collect instruments | tee summary_instruments.json
      - name: Historique du funding
        run: |
          for i in BTC ETH SOL XRP DOGE; do
            python -m okxbot.data.collect funding --inst $i-USDT-SWAP | tee -a summary_funding.json
          done
          # funding des X-Perps du panier U20 (identifiants lus dans la liste des instruments EEA)
          python - <<'PY' > xperp_ids.txt
          import json
          u20 = "BTC,ETH,SOL,XRP,DOGE,PEPE,NEAR,UNI,SUI,AAVE,FIL,BNB,ADA,LINK,AVAX,BCH,LTC,ICP,ARB,OP".split(",")
          fut = json.load(open("data/raw/okx/instruments/eea_FUTURES.json"))
          for x in fut:
              b = x["instFamily"].split("-")[0]
              if x.get("ruleType") == "xperp" and x["instFamily"].endswith("_UM_XPERP") and b in u20:
                  print(x["instId"])
          PY
          for i in $(cat xperp_ids.txt); do
            python -m okxbot.data.collect funding --inst $i | tee -a summary_funding.json || true
          done
      - name: Funding Binance (approximation pour l'historique ancien)
        continue-on-error: true
        run: |
          for s in BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT; do
            python -m okxbot.data.collect binance-funding --symbol $s | tee -a summary_binance_funding.json
          done
      - uses: actions/upload-artifact@v4
        with:
          name: reference
          path: |
            data/raw/okx/instruments
            data/raw/okx/funding
            data/raw/binance
            summary_*.json
          retention-days: 1

  publish:
    needs: [candles, candles_4h, reference]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publier sur la branche data
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo
          cd repo
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin +refs/heads/data:refs/remotes/origin/data
            git checkout -B data origin/data
          else
            git checkout --orphan data && git rm -rf . >/dev/null 2>&1 || true
            printf "# Branche data\n\nDonnées de marché collectées par GitHub Actions. Ne pas fusionner dans main.\n" > README.md
          fi
          mkdir -p data/raw reports/collect
          for d in ../artifacts/*/; do
            [ -d "$d/data" ] && cp -r "$d/data/." data/
            cp "$d"/*.json "$d"/*.txt reports/collect/ 2>/dev/null || true
          done
          date -u +"%Y-%m-%dT%H:%M:%SZ" > reports/collect/LAST_RUN.txt
          git add -A
          git commit -q -m "Données : collecte du $(date -u +%F)" || echo "Rien de nouveau"
          git push origin data
